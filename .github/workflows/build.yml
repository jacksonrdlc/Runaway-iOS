name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 30

    steps:
    - uses: actions/checkout@v4

    - name: Setup Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: '16.1'

    - name: Setup Mapbox authentication
      env:
        MAPBOX_SECRET_TOKEN: ${{ secrets.MAPBOX_SECRET_TOKEN }}
      run: |
        if [ -n "$MAPBOX_SECRET_TOKEN" ]; then
          echo "machine api.mapbox.com login mapbox password ${MAPBOX_SECRET_TOKEN}" > ~/.netrc
          chmod 600 ~/.netrc
        fi

    - name: Create config files
      run: |
        # Info.plist
        cp Runaway-iOS-Info.plist.template Runaway-iOS-Info.plist
        sed -i '' "s|YOUR_MAPBOX_TOKEN_HERE|pk.placeholder|g" Runaway-iOS-Info.plist
        sed -i '' "s|YOUR_SUPABASE_PROJECT_URL_HERE|https://placeholder.supabase.co|g" Runaway-iOS-Info.plist
        sed -i '' "s|YOUR_SUPABASE_ANON_KEY_HERE|placeholder_key|g" Runaway-iOS-Info.plist
        sed -i '' "s|YOUR_RUNAWAY_API_KEY_HERE|placeholder_api_key|g" Runaway-iOS-Info.plist

        # GoogleService-Info.plist
        cat > "Runaway iOS/GoogleService-Info.plist" << 'EOF'
        <?xml version="1.0" encoding="UTF-8"?>
        <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
        <plist version="1.0">
        <dict>
          <key>API_KEY</key>
          <string>placeholder</string>
          <key>GCM_SENDER_ID</key>
          <string>123456789</string>
          <key>BUNDLE_ID</key>
          <string>com.jackrudelic.labs.Runaway-iOS</string>
          <key>PROJECT_ID</key>
          <string>placeholder</string>
          <key>GOOGLE_APP_ID</key>
          <string>1:123456789:ios:placeholder</string>
        </dict>
        </plist>
        EOF

    - name: Build
      run: |
        xcodebuild build \
          -project "Runaway iOS.xcodeproj" \
          -scheme "Runaway iOS" \
          -destination "platform=iOS Simulator,name=iPhone 15" \
          -skipPackagePluginValidation \
          CODE_SIGNING_ALLOWED=NO
